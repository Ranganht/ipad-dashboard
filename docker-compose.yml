services:
  ipad-dashboard:
    image: nginx:alpine
    container_name: ipad-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - .env